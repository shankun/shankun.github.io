{% component quote(cite="") %}
<blockquote class="quote">
  {% set icon = load_data(path="static/icon/quote.svg") %}
  <div class="icon" style="display: none;">{{ icon | safe }}</div>
  <div class="content">{{ body | markdown | safe }}</div>
  {% if cite %}
  <div class="from">
    {{ "— " ~ cite | markdown | safe }}
  </div>
  {% endif %}
</blockquote>
{% endcomponent %}
